name: CI

on:
  push:
  pull_request:

jobs:
  php-unit:
    name: PHP Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, mbstring, openssl, json, ctype, tokenizer, xml, curl, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP files
        run: find app config routes database -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHP unit tests
        run: vendor/bin/phpunit --testsuite Unit

  node-unit:
    name: Node.js Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai-service/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate Node.js syntax
        run: node --check server.js

      - name: Run Node.js unit tests
        run: npm run test:unit

      - name: Run legacy Node.js AI tests
        run: npm test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [php-unit, node-unit]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sistem_kas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, openssl, json, ctype, tokenizer, xml, curl, zip
          coverage: none

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          APP_NAME="Sistem Kas CI"
          APP_ENV=testing
          APP_DEBUG=false
          APP_URL=http://localhost
          APP_KEY=sistem_kas_ci_key_not_for_production
          APP_TIMEZONE=Asia/Jakarta
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=sistem_kas_test
          DB_USERNAME=root
          DB_PASSWORD=root
          SESSION_LIFETIME=7200
          SESSION_SECURE_COOKIE=false
          AI_SERVICE_ENABLED=false
          AI_PROVIDER=gemini
          AI_API_KEY=
          AI_MODEL=gemini-1.5-flash
          EOF

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Initialize test database
        run: php database/migrate.php

      - name: Run final QA integration tests
        run: php test_final_qa.php

      - name: Run security integration tests
        run: php test_security.php

      - name: Run report integration tests
        run: php test_laporan.php

      - name: Run AI assistant integration tests
        run: php test_ai_assistant.php
